<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RED Kit">
  <title>RED Kit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="RED Kit"><span class="brand-mark">RED</span><span class="brand-text">KIT</span></div>
    <nav class="mainnav" id="mainnav">
      <button data-view="characters" class="active"><span class="ico">◆</span><span>Characters</span></button>
      <button data-view="combat"><span class="ico">⚔</span><span>Combat</span></button>
      <button data-view="map"><span class="ico">⬡</span><span>Maps</span></button>
      <button data-view="homebrew"><span class="ico">★</span><span>Homebrew</span></button>
      <button data-view="dice"><span class="ico">⚄</span><span>Dice</span></button>
    </nav>
    <button id="install-btn" class="btn sm yellow install-btn" hidden title="Install RED Kit as an app on this device">⇩ Install</button>
  </header>

  <main id="app">
    <section id="view-characters" class="view active"></section>
    <section id="view-combat" class="view"></section>
    <section id="view-map" class="view"></section>
    <section id="view-homebrew" class="view"></section>
    <section id="view-dice" class="view"></section>
  </main>

  <footer class="legal">
    <p>RED Kit is unofficial content provided under the Homebrew Content Policy of R. Talsorian Games and is not approved or endorsed by RTG. This content references materials that are the property of R. Talsorian Games and its licensees.</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/roller.js"></script>
  <script src="js/homebrew.js"></script>
  <script src="js/character.js"></script>
  <script src="js/ripperdoc.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/map.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
